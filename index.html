
<!DOCTYPE html>
<html lang="pt-BR">

<header>
    <title>Retro Games</title>
    <img src="logo.png" alt="Logo da RetroGames" class="logo">
    <link rel="stylesheet" href="style.css">
    <div class="cabecalho-texto">
        <h1>RetroGames 🎮</h1>
        <p>Seu catálogo de jogos clássicos!</p>
    </div>
</header>

<body>
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nosso catálogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>

            <button id="btnCadastrar" type="button">
                + Cadastrar Jogo
            </button>
        </div>

        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>

    <dialog id="modalCadastro">
        <h2>Novo Jogo</h2>

        <form id="formJogo">
            <label for="titulo">Título do jogo</label>
            <input type="text" id="titulo" required>

            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma"
                placeholder="Ex: SNES, Mega Drive, PS1" required>

            <label for="desenvolvedora">Desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>

            <label for="imagem">URL da imagem da capa</label>
            <input type="url" id="imagem"
                placeholder="https://site.com/capa.jpg" required>

            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco"
                min="0.01" step="0.01" required>

            <div class="acoes">
                <button type="button" id="btnCancelar"
                    class="cancelar">
                    Cancelar
                </button>

                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
